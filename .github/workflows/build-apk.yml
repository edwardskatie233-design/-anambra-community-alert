name: Build Anambra Community Alert APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Backup your lib
        run: mv lib lib_backup || true

      - name: Delete broken android
        run: rm -rf android

      - name: Create fresh Android folder
        run: flutter create --project-name anambra_community_alert --platforms=android .

      - name: Restore your lib
        run: |
          rm -rf lib
          mv lib_backup lib

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anambra-alert-apk
          path: build/app/outputs/flutter-apk/app-release.apk
